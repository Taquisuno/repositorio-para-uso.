<!doctype HTML>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>click UP</title>
	</head>
	<body>
		<header>
			<h1>click UP</h1>
		</header>
		<main>
			<p id = "pontos">0</p>
			<button id = "clickUP">click</button>
			<button id = "comprarMelhoria">comprar melhoria</button>
		</main>
		<script>
			let pontos = 0;
			let pontosPorClick = 1;
			let precoMelhoria1 = 10;
			const elementoPontos = document.querySelector("#pontos");
			const elementoBotao = document.querySelector("#clickUP");
			const elementoComprarMelhoria = document.querySelector("#comprarMelhoria");
			function atualizarInterface(){
				elementoPontos.textContent = pontos;
				elementoComprarMelhoria.textContent += " preço:" + precoMelhoria1;
			}
			
			function aumentarPontos(){
				pontos += pontosPorClick;
				atualizarInterface();
			}
			
			elementoBotao.addEventListener("click", aumentarPontos);
		</script>
	</body>
</html>
