<!doctype HTML>
<html>
	<head>
		<title>testando flexbox</title>
		<style>
			#teste_direto{
				border: solid 4px rgb(127, 127, 127);
				display: flex;
				flex-direction: row;
				width: 75%;
				
			}
			.item{
				border: solid 4px #00CCFF;
				padding: 5px;
				margin: 10px;
			}
			button{
				display: block;
				margin-top: 10px;
			}
		</style>
	</head>
	<body>
		<div id = "teste_direto">
			<p class="item">1</p>
			<p class="item">2</p>
			<p class="item">3</p>
			<p class="item">4</p>
			<p class="item">5</p>
		</div>
		<button onclick = "dobrarCaracteres()">click</button>
		<button onclick = "mudarDisplay()">click</button>
		<button onclick = "clearButton()">clear</button>
		<script>
			const teste_direto = document.querySelector("#teste_direto");
			const allItens = document.querySelectorAll(".item");
			let i = 0;
			function dobrarCaracteres(){
				for(let i = 0; i < allItens.length; i++){
					allItens[i].textContent += " " + allItens[i].textContent;
				}
			}
			function mudarDisplay(){
				switch(i){
					case 0:
						teste_direto.style.flexDirection = "row";
					break;
					case 1:
						teste_direto.style.flexDirection = "row-reverse";
					break;
					case 2:
						teste_direto.style.flexDirection = "column";
					break;
					case 3:
						teste_direto.style.flexDirection = "column-reverse";
					break;
				}
				i++;
				if(i > 3){
					i = 0;
				}
			}
			function clearButton(){
				for(let i = 0; i < allItens.length; i++){
					allItens[i].textContent = i + 1;
				}
			}
		</script>
	</body>
</html>
